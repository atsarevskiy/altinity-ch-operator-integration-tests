# Operator builds the matrix runs against, one per line.
#   label      bundle version  image                       bundle ref
# image: "-" for the released image of that version, "build:<git-ref>" to build it from source with
# scripts/build-operator.sh, or any image name already present. For a pull request use
# build:pr/<N>@<base-ref>: a PR branch can sit far behind the release it targets (PR #2071's branch
# is 156 commits behind release-0.27.4 and predates the Keeper quorum work), so building the branch
# as it stands measures the old base rather than the change.
# bundle ref: "-" for release-<version>, or a git ref whose install bundle to apply.
0.26.3        0.26.3   -                            -
# 0.27.0 and 0.27.1 bracket the change that stopped a failed StatefulSet create from being
# swallowed (upstream commit 2e411f5e, first tagged release-0.27.1).
0.27.0        0.27.0   -                            -
