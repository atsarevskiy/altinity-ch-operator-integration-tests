apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: ${CHI}
spec:
  defaults:
    templates:
      podTemplate: server
      dataVolumeClaimTemplate: data
  configuration:
    clusters:
      - name: main
        layout:
          shardsCount: 3
          replicasCount: 1
  templates:
    podTemplates:
      - name: server
        metadata:
          labels:
            probe: "${PROBE_LABEL}"
        spec:
          containers:
            - name: clickhouse
              image: ${CLICKHOUSE_IMAGE}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
